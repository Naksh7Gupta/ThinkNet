[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thinknet-backend-core"
version = "0.2.0"
description = "Dimension-aware node graph backend core for ThinkNet"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "pydantic>=2.5", "fastapi>=0.110", "uvicorn[standard]>=0.27", "transformers>=4.40", "safetensors>=0.4.3", "accelerate>=0.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
